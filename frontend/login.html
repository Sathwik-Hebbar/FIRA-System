<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIRA – Emergency Operations & Citizen Access</title>
  <meta name="description" content="Secure authentication gateway for FIRA Flood Intelligence & Emergency Response platform." />
  <link rel="stylesheet" href="css/style.css?v=2.2" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, rgba(29, 78, 216, 0.08) 0%, rgba(248, 250, 252, 1) 65%);
      padding: var(--space-md);
    }

    .login-wrap {
      width: 100%;
      max-width: 420px;
    }

    .login-brand {
      text-align: center;
      margin-bottom: var(--space-xl);
    }

    .login-brand .brand-icon {
      margin: 0 auto 14px auto;
      width: 52px;
      height: 52px;
      font-size: 26px;
      border-radius: var(--radius);
      box-shadow: 0 10px 24px rgba(29, 78, 216, 0.22);
    }

    .login-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: var(--green-subtle);
      border: 1px solid var(--green-border);
      border-radius: 100px;
      color: var(--green);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .login-eyebrow .pulse-dot {
      width: 7px;
      height: 7px;
    }

    .login-brand h1 {
      font-size: 26px;
      font-weight: 800;
      color: var(--accent-deep);
      letter-spacing: -0.03em;
    }

    .login-brand p {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 4px;
    }

    .login-card {
      position: relative;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 28px;
      box-shadow: var(--shadow-lg);
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 28px; right: 28px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), #2dd4bf);
      border-radius: 0 0 4px 4px;
    }

    .login-card-header { margin-bottom: 24px; }
    .login-card-header h2 { font-size: 18px; }
    .login-card-header p { margin-top: 4px; color: var(--text-muted); font-size: 13px; }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 7px;
    }

    .form-group input {
      padding: 12px 14px;
      font-size: 14px;
      border: 1px solid var(--border-mid);
      border-radius: var(--radius-sm);
    }

    .form-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-subtle);
    }

    #login-btn {
      width: 100%;
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
      margin-top: 8px;
    }

    .error-msg {
      display: none;
      background: #fee2e2;
      border: 1px solid #fecaca;
      border-radius: var(--radius-sm);
      color: #b91c1c;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
      text-align: center;
    }

    .error-msg.show {
      display: block;
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-dim);
    }

    .login-footer strong {
      color: var(--accent);
    }
  </style>
</head>
<body>

<div class="login-wrap">
  <div class="login-brand">
    <div class="brand-icon">🌊</div>
    <div class="login-eyebrow">
      <div class="pulse-dot"></div>
      Secure Emergency Network
    </div>
    <h1>FIRA Intelligence</h1>
    <p>Flood Incident & Response Coordination Platform</p>
  </div>

  <div class="login-card">
    <div id="error-msg" class="error-msg" role="alert"></div>
    <div class="login-card-header">
      <h2>Sign in to FIRA</h2>
      <p>Use your registered citizen or response-team account.</p>
    </div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email">Account Email</label>
        <input id="email" type="email" placeholder="name@organization.gov" autocomplete="email" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••••••••" autocomplete="current-password" required />
      </div>
      <button type="submit" id="login-btn" class="btn btn-primary">Sign In</button>
    </form>

    <div class="login-footer">
      <div>Authorized Response Teams & Citizens</div>
      <div style="margin-top: 4px;">Emergency Helpline: <strong>+91 80715 79681</strong></div>
    </div>
  </div>
</div>

<script>
  const API = /^https?:$/.test(window.location.protocol)
    ? window.location.origin
    : 'http://localhost:8000';

  // If already logged in, redirect
  (function () {
    const token = localStorage.getItem('fira_token');
    const raw = localStorage.getItem('fira_user');
    if (token && raw) {
      try {
        const user = JSON.parse(raw);
        const now = Math.floor(Date.now() / 1000);
        if (user.exp && now < user.exp) {
          redirect(user.role);
          return;
        }
      } catch (_) {}
    }
  })();

  function redirect(role) {
    if (role === 'command_center') {
      window.location.href = 'command.html';
    } else {
      window.location.href = 'index.html';
    }
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.classList.add('show');
  }

  function hideError() {
    document.getElementById('error-msg').classList.remove('show');
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('login-btn');

    if (!email) { showError('Please enter your email address.'); return; }
    if (!password) { showError('Please enter your password.'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError('Please enter a valid email address.'); return; }

    btn.disabled = true;
    btn.textContent = 'Verifying credentials…';

    try {
      const res = await fetch(`${API}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Server error ${res.status}`);
      }

      const data = await res.json();
      localStorage.setItem('fira_token', data.access_token);
      const payload = JSON.parse(atob(data.access_token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
      const userObj = { ...data.user, ...payload };
      localStorage.setItem('fira_user', JSON.stringify(userObj));

      redirect(data.user.role);

    } catch (err) {
      let msg = err.message || 'Login failed. Please verify your credentials.';
      if (msg.toLowerCase().includes('incorrect') || msg === '401 Unauthorized') {
        msg = 'Invalid email or password.';
      } else if (msg.includes('fetch') || msg.includes('NetworkError') || msg.includes('Failed')) {
        msg = 'Cannot reach server. Please ensure the backend service is running.';
      }
      showError(msg);
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
