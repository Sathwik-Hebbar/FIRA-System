<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIRA – My Reports</title>
  <meta name="description" content="View the status of your flood incident reports." />
  <link rel="stylesheet" href="css/style.css?v=2.2" />
  <style>
    main { padding: var(--space-xl) var(--space-lg); max-width: 960px; margin: 0 auto; }

    .page-title {
      display: none;
      font-size: 24px; font-weight: 800; margin-bottom: 24px;
      display: flex; align-items: center; gap: 10px;
      color: var(--accent-deep);
    }

    .report-card {
      background: #ffffff; border: 1px solid var(--border);
      border-radius: var(--radius); padding: 22px;
      margin-bottom: 18px; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: var(--shadow-sm);
      animation: fadeIn 0.3s ease;
    }
    .report-card:hover {
      border-color: var(--accent-border);
      box-shadow: var(--shadow);
      transform: translateY(-1px);
    }

    .report-header {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 16px; flex-wrap: wrap;
    }
    .report-id   { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: var(--accent); }
    .report-time { font-size: 12px; color: var(--text-dim); margin-left: auto; }

    .status-pill {
      padding: 4px 12px; border-radius: 100px; font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .status-reported    { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
    .status-prioritized { background: var(--accent-subtle); color: var(--accent); border: 1px solid var(--accent-border); }
    .status-assigned    { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
    .status-in_progress { background: #ffedd5; color: #c2410c; border: 1px solid #fed7aa; }
    .status-resolved    { background: var(--green-subtle); color: var(--green); border: 1px solid var(--green-border); }

    .priority-badge {
      padding: 4px 12px; border-radius: 100px; font-size: 11px; font-weight: 700;
    }
    .prio-Critical { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
    .prio-High     { background: #ffedd5; color: #c2410c; border: 1px solid #fed7aa; }
    .prio-Moderate { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
    .prio-Low      { background: var(--green-subtle); color: var(--green); border: 1px solid var(--green-border); }

    .report-body {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 12px; background: var(--bg-subtle); padding: 14px;
      border-radius: var(--radius-sm); border: 1px solid var(--border);
    }
    .rb-item { font-size: 13px; }
    .rb-label { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; font-weight: 700; }
    .rb-value { font-weight: 600; color: var(--text); }

    .progress-track {
      display: flex; gap: 6px; margin-top: 18px; align-items: center;
    }
    .progress-step {
      flex: 1; height: 6px; border-radius: 100px;
      background: var(--border);
      transition: all 0.3s ease;
    }
    .progress-step.done { background: var(--accent); }
    .progress-step.active { background: var(--accent-light); box-shadow: 0 0 8px var(--accent-glow); }
    .progress-step.resolved-done { background: var(--green); box-shadow: 0 0 8px var(--green-glow); }

    .progress-labels {
      display: flex; justify-content: space-between;
      font-size: 10px; color: var(--text-dim);
      font-weight: 600; text-transform: uppercase; margin-top: 6px;
    }

    .empty-state {
      text-align: center; padding: 60px 20px; color: var(--text-muted);
      background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
    }
    .empty-state .es-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; color: var(--text); }

    .refresh-btn { display: none; }
  </style>
</head>
<body>

<div id="nav"></div>

<header>
  <a class="brand" href="index.html">
    <div class="brand-icon">🌊</div>
    <div class="brand-name">FI<span>RA</span></div>
  </a>
  <div style="display:flex;gap:8px">
    <a href="report.html" class="btn btn-primary">⚠️ New Report</a>
    <a href="index.html" class="btn btn-ghost">🗺 Map</a>
  </div>
</header>

<main>
  <section class="page-intro" style="margin-bottom:24px">
    <div>
      <div class="page-kicker">Citizen workspace</div>
      <h1>My incident reports</h1>
      <p>Track each report from initial assessment through resolution.</p>
    </div>
    <button class="btn btn-ghost" onclick="load()">Refresh reports</button>
  </section>
  <div class="page-title">📋 My Reports</div>
  <button class="btn btn-ghost refresh-btn" onclick="load()">↻ Refresh</button>
  <div id="reports-container">
    <div class="empty-state">
      <div class="es-icon">⏳</div>
      <p>Loading your reports…</p>
    </div>
  </div>
</main>

<script src="auth.js?v=2.2"></script>
<script>
  const currentUser = window.auth.enforceAuth('citizen');
  if (!currentUser) throw new Error('Not authenticated');

  const STEPS = ['reported', 'prioritized', 'assigned', 'in_progress', 'resolved'];
  const STEP_LABELS = ['Reported', 'Prioritized', 'Assigned', 'In Progress', 'Resolved'];

  function stepIndex(status) {
    return STEPS.indexOf(status);
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' })
      + ' ' + d.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit', hour12: true });
  }

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function buildProgressBar(status) {
    const idx = stepIndex(status);
    const isResolved = status === 'resolved';

    const steps = STEPS.map((s, i) => {
      let cls = 'progress-step';
      if (isResolved) cls += ' resolved-done';
      else if (i < idx) cls += ' done';
      else if (i === idx) cls += ' active';
      return `<div class="${cls}"></div>`;
    }).join('');

    const labels = STEP_LABELS.map(l => `<span>${l}</span>`).join('');

    return `
      <div class="progress-track">${steps}</div>
      <div class="progress-labels">${labels}</div>
    `;
  }

  function levelColor(level) {
    return { Critical: '#ef4444', High: '#f97316', Moderate: '#eab308', Low: '#22c55e' }[level] || '#60a5fa';
  }

  function renderCard(r) {
    const pClass = `prio-${r.priority_level || 'Low'}`;
    const sClass = `status-${r.status}`;
    const color  = levelColor(r.priority_level);

    return `
      <div class="report-card">
        <div class="report-header">
          <span class="report-id">#${r.id}</span>
          ${r.source === 'VOICE_CALL' ? '<span style="font-size:10px;padding:2px 7px;border-radius:100px;background:rgba(168,85,247,0.18);color:#c084fc;font-weight:700">📞 Voice</span>' : ''}
          <span class="status-pill ${sClass}">${r.status.replace('_', ' ')}</span>
          ${r.priority_level ? `<span class="priority-badge ${pClass}">${r.priority_level}</span>` : ''}
          ${r.priority_score != null ? `<span style="font-size:11px;color:${color}">Score: ${r.priority_score.toFixed(3)}</span>` : ''}
          <span class="report-time">${fmtDate(r.created_at)}</span>
        </div>

        <div class="report-body">
          <div class="rb-item">
            <div class="rb-label">Severity</div>
            <div class="rb-value">${r.severity} / 5</div>
          </div>
          ${r.flood_type ? `<div class="rb-item"><div class="rb-label">Flood Type</div><div class="rb-value">${escHtml(r.flood_type)}</div></div>` : ''}
          ${r.water_depth_m != null ? `<div class="rb-item"><div class="rb-label">Water Depth</div><div class="rb-value">${r.water_depth_m}m</div></div>` : ''}
          ${r.people_affected != null ? `<div class="rb-item"><div class="rb-label">People Affected</div><div class="rb-value">${r.people_affected}</div></div>` : ''}
          ${r.people_trapped ? `<div class="rb-item"><div class="rb-label">Trapped</div><div class="rb-value" style="color:#f97316">${r.people_trapped}</div></div>` : ''}
          ${r.medical_emergency ? `<div class="rb-item"><div class="rb-label">Medical</div><div class="rb-value" style="color:#ef4444">🚑 YES</div></div>` : ''}
          ${r.shelter_name ? `<div class="rb-item"><div class="rb-label">Shelter</div><div class="rb-value">${escHtml(r.shelter_name)}</div></div>` : ''}
          ${r.assigned_resource ? `<div class="rb-item"><div class="rb-label">Resource</div><div class="rb-value">${escHtml(r.assigned_resource)}</div></div>` : ''}
          ${r.description ? `<div class="rb-item" style="grid-column:1/-1"><div class="rb-label">Description</div><div class="rb-value" style="font-weight:400">${escHtml(r.description)}</div></div>` : ''}
        </div>

        ${buildProgressBar(r.status)}
      </div>
    `;
  }

  async function load() {
    const container = document.getElementById('reports-container');
    container.innerHTML = `<div class="empty-state"><div class="es-icon">⏳</div><p>Loading…</p></div>`;
    try {
      const reports = await window.auth.apiFetch('/incidents');
      if (!reports || reports.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="es-icon">📭</div>
            <p>You haven't submitted any reports yet.</p>
            <a href="report.html" class="btn btn-primary" style="margin-top:16px">Submit a Report</a>
          </div>`;
        return;
      }
      container.innerHTML = reports.map(renderCard).join('');
    } catch (err) {
      container.innerHTML = `<div class="empty-state"><div class="es-icon">⚠️</div><p>${window.auth.errorMessage(err, 'Your reports are unavailable right now.')}</p></div>`;
    }
  }

  // Auto-refresh every 15 seconds
  load();
  setInterval(load, 15000);
</script>
</body>
</html>
